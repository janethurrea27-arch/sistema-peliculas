<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Gestión de Películas</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>

    <div class="contenedor">

        <h1>🎬 Sistema de Gestión de Películas</h1>

        <!-- FORMULARIO -->
        <section class="formulario-section">

            <form id="formularioPeliculas">

                <input type="hidden" id="indiceEditar">

                <div class="grupo-formulario">
                    <label>Título</label>
                    <input
                        type="text"
                        id="titulo"
                        placeholder="Ingrese el título"
                    >
                </div>

                <div class="grupo-formulario">
                    <label>Director</label>
                    <input
                        type="text"
                        id="director"
                        placeholder="Ingrese el director"
                    >
                </div>

                <div class="grupo-formulario">
                    <label>Año</label>
                    <input
                        type="number"
                        id="anio"
                        placeholder="Ej: 2024"
                    >
                </div>

                <div class="grupo-formulario">
                    <label>Categoría</label>

                    <select id="categoria">
                        <option value="">
                            Seleccione una categoría
                        </option>

                        <option value="Acción">Acción</option>
                        <option value="Comedia">Comedia</option>
                        <option value="Drama">Drama</option>
                        <option value="Terror">Terror</option>
                    </select>
                </div>

                <button type="submit" id="botonGuardar">
                    Guardar Película
                </button>

            </form>

        </section>

        <!-- FILTROS -->
        <section class="filtros-section">

            <input
                type="text"
                id="buscador"
                placeholder="🔍 Buscar película por título"
            >

            <select id="filtroCategoria">
                <option value="Todas">
                    Todas las categorías
                </option>

                <option value="Acción">Acción</option>
                <option value="Comedia">Comedia</option>
                <option value="Drama">Drama</option>
                <option value="Terror">Terror</option>
            </select>

        </section>

        <!-- TABLA -->
        <section class="tabla-section">

            <table>

                <thead>
                    <tr>
                        <th>Título</th>
                        <th>Director</th>
                        <th>Año</th>
                        <th>Categoría</th>
                        <th>Acciones</th>
                    </tr>
                </thead>

                <tbody id="tablaPeliculas">

                </tbody>

            </table>

        </section>

    </div>

    <script src="script.js"></script>

</body>
</html>
